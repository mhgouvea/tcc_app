{% extends "base.html" %}
{% block title %}Novo paciente{% endblock %}
{% block heading %}Cadastro de paciente{% endblock %}
{% block subheading %}<p class="form-hint">Dados de identificação — requisito funcional (a) do sistema.</p>{% endblock %}

{% block content %}
<div class="card" style="max-width: 640px;">
  <form method="post">
    <div class="form-group">
      <label for="nome">Nome completo *</label>
      <input type="text" id="nome" name="nome" value="{{ form.nome or '' }}" required>
    </div>
    <div class="grid grid-2">
      <div class="form-group">
        <label for="data_nascimento">Data de nascimento</label>
        <input type="date" id="data_nascimento" name="data_nascimento" value="{{ form.data_nascimento or '' }}">
      </div>
      <div class="form-group">
        <label for="sexo">Sexo</label>
        <select id="sexo" name="sexo">
          <option value="">Selecione</option>
          <option value="Feminino">Feminino</option>
          <option value="Masculino">Masculino</option>
          <option value="Outro">Outro</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label for="cartao_sus">Cartão SUS (opcional)</label>
      <input type="text" id="cartao_sus" name="cartao_sus" value="{{ form.cartao_sus or '' }}">
    </div>
    <button class="btn" type="submit">Cadastrar e iniciar triagem →</button>
  </form>
</div>
{% endblock %}
